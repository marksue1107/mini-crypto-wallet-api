name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test ./... -race -count=1

      - name: forbid "testing" import outside _test.go files
        run: |
          matches=$(grep -rl '"testing"' --include='*.go' . | grep -v '_test\.go$' || true)
          if [ -n "$matches" ]; then
            echo "Non-test files must not import \"testing\":"
            echo "$matches"
            exit 1
          fi
