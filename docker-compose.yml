services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka_client
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers on the compose network
      # (api -> kafka:9092), one for the host machine (localhost:29092).
      # A single "localhost" advertised listener only works for clients on
      # the host itself - a container connecting via the "kafka" hostname
      # would be handed back an advertised address of "localhost", which
      # from inside that container means itself, not the broker.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mini_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
    container_name: mini-wallet-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_DRIVER: postgres
      POSTGRES_DSN: host=postgres user=postgres password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env} dbname=mini_wallet port=5432 sslmode=disable
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env to a random string of at least 32 characters}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAX_TRANSFER_AMOUNT: ${MAX_TRANSFER_AMOUNT:-1000000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # No container-level healthcheck here: the runtime image is distroless
    # (no shell, no curl/wget - see docs/AUDIT.md Q5), so Docker can't exec
    # a check command inside it. Verify readiness from the host instead:
    #   curl -f http://localhost:8080/health
    #   curl -f http://localhost:8080/ready

volumes:
  pg_data:
