components:
    schemas:
        models.CurrencyResponse:
            properties:
                code:
                    example: USDT
                    type: string
                created_at:
                    type: string
                decimals:
                    example: 6
                    type: integer
                id:
                    example: 1
                    type: integer
                is_active:
                    example: true
                    type: boolean
                name:
                    example: Tether
                    type: string
                symbol:
                    example: $
                    type: string
                updated_at:
                    type: string
            type: object
        models.ErrorResponse:
            properties:
                code:
                    type: string
                error:
                    type: string
                message:
                    type: string
            type: object
        models.LoginRequest:
            properties:
                password:
                    example: password123
                    type: string
                username:
                    example: alice
                    type: string
            required:
                - password
                - username
            type: object
        models.LoginResponse:
            properties:
                expires_in:
                    description: Seconds until token expiration
                    type: integer
                token:
                    type: string
                user_id:
                    type: integer
                username:
                    type: string
            type: object
        models.PaginationResponse:
            properties:
                page:
                    type: integer
                page_size:
                    type: integer
                total:
                    type: integer
                total_pages:
                    type: integer
            type: object
        models.TransactionListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/models.TransactionResponse'
                    type: array
                pagination:
                    $ref: '#/components/schemas/models.PaginationResponse'
            type: object
        models.TransactionResponse:
            properties:
                amount:
                    example: 100
                    type: number
                created_at:
                    type: string
                currency_id:
                    example: 1
                    type: integer
                from_user_id:
                    example: 1
                    type: integer
                hash:
                    example: abc123...
                    type: string
                id:
                    example: 1
                    type: integer
                signature:
                    example: SIG-1-100-123456
                    type: string
                status:
                    example: completed
                    type: string
                to_user_id:
                    example: 2
                    type: integer
            type: object
        models.TransferRequest:
            properties:
                amount:
                    example: 150
                    type: number
                currency_id:
                    description: 幣種 ID
                    example: 1
                    type: integer
                from_user_id:
                    example: 1
                    type: integer
                to_user_id:
                    example: 2
                    type: integer
            required:
                - amount
                - currency_id
                - from_user_id
                - to_user_id
            type: object
        models.UserCreateRequest:
            properties:
                email:
                    example: alice@example.com
                    type: string
                password:
                    example: password123
                    minLength: 8
                    type: string
                username:
                    example: alice
                    maxLength: 50
                    minLength: 3
                    type: string
            required:
                - email
                - password
                - username
            type: object
        models.UserResponse:
            properties:
                created_at:
                    type: string
                email:
                    example: alice@example.com
                    type: string
                id:
                    example: 1
                    type: integer
                username:
                    example: alice
                    type: string
            type: object
        models.WalletResponse:
            properties:
                balance:
                    example: 1000
                    type: number
                created_at:
                    type: string
                currency_id:
                    example: 1
                    type: integer
                id:
                    example: 1
                    type: integer
                user_id:
                    example: 1
                    type: integer
            type: object
info:
    contact:
        email: dev@example.com
        name: Mark
    description: Mini crypto wallet backend API.
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT
    termsOfService: http://swagger.io/terms/
    title: Mini Crypto Wallet API
    version: "1.0"
openapi: 3.0.3
paths:
    /auth/login:
        post:
            description: authenticate user and return JWT token
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/models.LoginRequest'
                description: Login credentials
                required: true
                x-originalParamName: login
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.LoginResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Unauthorized
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Too Many Requests
            summary: User login
            tags:
                - Auth
    /currencies:
        get:
            description: Get list of all active currencies
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/models.CurrencyResponse'
                                type: array
                    description: OK
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Internal Server Error
            summary: Get all currencies
            tags:
                - Currency
    /currencies/{id}:
        get:
            description: Get currency details by ID
            parameters:
                - description: Currency ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.CurrencyResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Not Found
            summary: Get currency by ID
            tags:
                - Currency
    /health:
        get:
            description: Check if the service is healthy
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties:
                                    type: string
                                type: object
                    description: OK
            summary: Health check
            tags:
                - Health
    /ready:
        get:
            description: Check if the service is ready to serve requests
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties:
                                    type: string
                                type: object
                    description: OK
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties:
                                    type: string
                                type: object
                    description: Service Unavailable
            summary: Readiness check
            tags:
                - Health
    /transactions/{user_id}:
        get:
            description: Get all transactions related to a specific user with pagination
            parameters:
                - description: User ID
                  in: path
                  name: user_id
                  required: true
                  schema:
                    type: integer
                - description: Page number
                  in: query
                  name: page
                  schema:
                    default: 1
                    type: integer
                - description: Page size
                  in: query
                  name: page_size
                  schema:
                    default: 20
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.TransactionListResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Forbidden
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: Get user transactions
            tags:
                - Transactions
    /tx/{hash}:
        get:
            description: Get a transaction detail by its unique hash. Public endpoint (no auth required) - see docs/AUDIT.md S6.
            parameters:
                - description: Transaction Hash
                  in: path
                  name: hash
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.TransactionResponse'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Not Found
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Too Many Requests
            summary: Get transaction by hash
            tags:
                - Transactions
    /users:
        post:
            description: create a new wallet user
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/models.UserCreateRequest'
                description: User info
                required: true
                x-originalParamName: user
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.UserResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Conflict
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Too Many Requests
            summary: Create user
            tags:
                - Users
    /wallet/{user_id}:
        get:
            description: Retrieve wallet balance by user ID
            parameters:
                - description: User ID
                  in: path
                  name: user_id
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.WalletResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: Get wallet balance
            tags:
                - Wallet
    /wallet/transfer:
        post:
            description: Transfer funds between two users
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/models.TransferRequest'
                description: Transfer info
                required: true
                x-originalParamName: transfer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.TransactionResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Not Found
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/models.ErrorResponse'
                    description: Too Many Requests
            security:
                - BearerAuth: []
            summary: Transfer funds
            tags:
                - Wallet
servers:
    - url: https://localhost:8080/
