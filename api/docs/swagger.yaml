basePath: /
definitions:
  models.CurrencyResponse:
    properties:
      code:
        example: USDT
        type: string
      created_at:
        type: string
      decimals:
        example: 6
        type: integer
      id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: Tether
        type: string
      symbol:
        example: $
        type: string
      updated_at:
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      expires_in:
        description: Seconds until token expiration
        type: integer
      token:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  models.TransactionResponse:
    properties:
      amount:
        example: 100
        type: number
      created_at:
        type: string
      from_user_id:
        example: 1
        type: integer
      hash:
        example: abc123...
        type: string
      id:
        example: 1
        type: integer
      signature:
        example: SIG-1-100-123456
        type: string
      status:
        example: completed
        type: string
      to_user_id:
        example: 2
        type: integer
    type: object
  models.TransferRequest:
    properties:
      amount:
        example: 150
        type: number
      currency_id:
        description: 幣種 ID
        example: 1
        type: integer
      from_user_id:
        example: 1
        type: integer
      to_user_id:
        example: 2
        type: integer
    required:
    - amount
    - currency_id
    - from_user_id
    - to_user_id
    type: object
  models.UserCreateRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: alice
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: alice@example.com
        type: string
      id:
        example: 1
        type: integer
      username:
        example: alice
        type: string
    type: object
  models.WalletResponse:
    properties:
      balance:
        example: 1000
        type: number
      created_at:
        type: string
      currency_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: dev@example.com
    name: Mark
  description: Mini crypto wallet backend API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Mini Crypto Wallet API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Auth
  /currencies:
    get:
      description: Get list of all active currencies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CurrencyResponse'
            type: array
      summary: Get all currencies
      tags:
      - Currency
  /currencies/{id}:
    get:
      description: Get currency details by ID
      parameters:
      - description: Currency ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CurrencyResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get currency by ID
      tags:
      - Currency
  /health:
    get:
      description: Check if the service is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /ready:
    get:
      description: Check if the service is ready to serve requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - Health
  /transactions/{user_id}:
    get:
      description: Get all transactions related to a specific user with pagination
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user transactions
      tags:
      - Transactions
  /tx/{hash}:
    get:
      description: Get a transaction detail by its unique hash
      parameters:
      - description: Transaction Hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TransactionResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get transaction by hash
      tags:
      - Transactions
  /users:
    post:
      consumes:
      - application/json
      description: create a new wallet user
      parameters:
      - description: User info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UserCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create user
      tags:
      - Users
  /wallet/{user_id}:
    get:
      description: Retrieve wallet balance by user ID
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WalletResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get wallet balance
      tags:
      - Wallet
  /wallet/transfer:
    post:
      consumes:
      - application/json
      description: Transfer funds between two users
      parameters:
      - description: Transfer info
        in: body
        name: transfer
        required: true
        schema:
          $ref: '#/definitions/models.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Transfer funds
      tags:
      - Wallet
swagger: "2.0"
